    <rect x="152" y="120" width="208" height="208" fill="white"/>
    <path d="M208 224 L256 160 L304 224 L272 224 L272 320 L240 320 L240 224 Z" fill="black"/>
  </mask>
  <circle cx="256" cy="224" r="96" fill="white" mask="url(#arrow-cutout)"/>
</svg>

<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#ffffff" />
		<meta name="color-scheme" content="light" />
		<script>
			// Apply the stored design variant before the first paint, so the
			// page never flashes the other look (designVariant.stores.js).
			(() => {
				var v = 'a';
				try {
					var s = localStorage.getItem('rbl:design-variant');
					if (s === 'a' || s === 'b') v = s;
				} catch (e) {}
				document.documentElement.dataset.variant = v;
				if (v === 'b') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#3a9441');
			})();
		</script>
		<meta name="description" content="RasenBürosport Leipzig – Office Sports Tracker" />

		<!-- PWA -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/logo.png" />

		<!-- iOS PWA support -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="RasenBürosport" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
